services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: async-engine-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: async-engine-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: async-engine-api
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPS_API_KEY=${OPS_API_KEY:-ops-dev-secret}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: async-engine-worker
    command: ["python", "-m", "src.worker"]
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BATCH_CHUNK_SIZE=50
      - WORKER_QUEUE_NAME=tasks_primary
      - WORKER_ROUTING_KEY=tasks.general.*
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET:-webhook-dev-secret}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
