[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-task-engine"
version = "1.0.0"
description = "Production-grade asynchronous task execution engine for batch processing and operations automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "George Ladd", email = "george.tourist.555@gmail.com" },
]
keywords = [
    "async",
    "tasks",
    "rabbitmq",
    "redis",
    "fastapi",
    "batch-processing",
    "queue",
    "distributed-lock",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "aio-pika>=9.4.0",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "uv>=0.1.0",
]

[project.scripts]
async-engine = "src.cli:cli_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "-v --cov=src"
